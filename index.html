<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nyamuk — Team Command Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#0d1117; --panel:#151b24; --panel-2:#1b2330; --border:#2a3341;
  --text:#e7ebf0; --text-dim:#8a93a3; --text-faint:#5b6472;
  --amber:#f2a63d; --amber-dim:#7a5a26;
  --green:#3ecf8e; --green-dim:#1f5c46;
  --red:#f2555a; --red-dim:#5c2528;
  --blue:#4d8dff; --blue-dim:#233c6b;
  --purple:#a78bfa; --purple-dim:#3d3468;
  --radius:10px; --radius-lg:16px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
[data-theme="light"]{
  --bg:#f3f4f7; --panel:#ffffff; --panel-2:#eef0f4;
  --border:#dbe0e8; --text:#151b24; --text-dim:#5b6472; --text-faint:#8a93a3;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.display{font-family:var(--font-display);letter-spacing:-0.01em;}
.mono{font-family:var(--font-mono);}
a{color:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- shell ---------- */
#shell{display:flex;min-height:100vh;}
#sidebar{width:230px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 22px 10px;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--amber),var(--red));flex-shrink:0;position:relative;box-shadow:0 0 16px rgba(242,166,61,0.35);}
.brand-mark::after{content:'';position:absolute;inset:9px;background:var(--panel);border-radius:3px;}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:1.05rem;}
.nav-group{margin-bottom:18px;}
.nav-label{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.09em;color:var(--text-faint);padding:0 10px;margin-bottom:6px;font-weight:600;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:0.86rem;font-weight:500;color:var(--text-dim);position:relative;transition:background .12s,color .12s;}
.nav-item:hover{background:var(--panel-2);color:var(--text);}
.nav-item.active{background:var(--panel-2);color:var(--text);}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--amber);border-radius:3px;box-shadow:0 0 8px var(--amber);}
.nav-item .ic{width:16px;text-align:center;opacity:0.9;}
.nav-badge{margin-left:auto;background:var(--red-dim);color:var(--red);font-size:0.65rem;font-weight:700;padding:1px 6px;border-radius:20px;}
.sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);}

#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 26px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:40;}
.topbar-title{font-family:var(--font-display);font-weight:700;font-size:1.15rem;}
.topbar-sub{color:var(--text-dim);font-size:0.8rem;margin-top:2px;}
#content{padding:22px 26px 60px 26px;}

/* ---------- generic bits ---------- */
.btn{padding:8px 15px;border-radius:8px;font-weight:600;border:1px solid transparent;cursor:pointer;font-size:0.83rem;display:inline-flex;align-items:center;gap:6px;transition:all .12s;font-family:var(--font-body);}
.btn-primary{background:var(--amber);color:#1a1204;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text);}
.btn-outline:hover{background:var(--panel-2);}
.btn-ghost{background:transparent;border:none;color:var(--text-dim);}
.btn-ghost:hover{color:var(--text);}
.btn-danger{background:transparent;border-color:var(--red-dim);color:var(--red);}
.btn-danger:hover{background:var(--red-dim);}
.btn-sm{padding:5px 10px;font-size:0.74rem;}

input,select,textarea{padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);color:var(--text);font-size:0.85rem;font-family:var(--font-body);width:100%;}
textarea{font-family:var(--font-body);resize:vertical;}
label{font-size:0.68rem;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:5px;}
.field{margin-bottom:12px;}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;}
.card-title{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-faint);margin-bottom:12px;}

.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

/* signal dot -- the signature element */
.signal{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;position:relative;}
.signal::after{content:'';position:absolute;inset:-4px;border-radius:50%;opacity:0.35;}
.signal.green{background:var(--green);}.signal.green::after{background:var(--green);}
.signal.amber{background:var(--amber);}.signal.amber::after{background:var(--amber);}
.signal.red{background:var(--red);}.signal.red::after{background:var(--red);}
.signal.blue{background:var(--blue);}.signal.blue::after{background:var(--blue);}
.signal.grey{background:var(--text-faint);}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:0.7rem;font-weight:600;}
.chip.status-todo{background:var(--panel-2);color:var(--text-dim);}
.chip.status-inprogress{background:var(--blue-dim);color:var(--blue);}
.chip.status-blocked{background:var(--red-dim);color:var(--red);}
.chip.status-done{background:var(--green-dim);color:var(--green);}
.chip.pri-urgent{background:var(--red-dim);color:var(--red);}
.chip.pri-high{background:var(--amber-dim);color:var(--amber);}
.chip.pri-med{background:var(--blue-dim);color:var(--blue);}
.chip.pri-low{background:var(--panel-2);color:var(--text-dim);}
.chip.cr{background:var(--purple-dim);color:var(--purple);}

.avatar{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.75rem;color:#fff;flex-shrink:0;}
.avatar.sm{width:22px;height:22px;font-size:0.62rem;border-radius:6px;}
.role-badge{font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;padding:2px 7px;border-radius:5px;}
.role-badge.leader{background:var(--amber-dim);color:var(--amber);}
.role-badge.exec{background:var(--purple-dim);color:var(--purple);}
.role-badge.member{background:var(--panel-2);color:var(--text-dim);}

/* modal */
.modal-veil{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:900;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);width:480px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,0.45);}
.modal-wide{width:720px;}
.modal-xl{width:94vw;max-width:1400px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h3{margin:0;font-size:1.05rem;}

table{width:100%;border-collapse:collapse;font-size:0.83rem;}
th{text-align:left;color:var(--text-faint);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;padding:8px 10px;border-bottom:1px solid var(--border);font-weight:700;}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.task-row:hover{background:var(--panel-2);}

.progress-track{height:7px;background:var(--panel-2);border-radius:20px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--green));border-radius:20px;}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-faint);}
.empty-state .ic{font-size:2rem;margin-bottom:10px;}

/* identity gate */
#identityGate{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;}
.gate-card{width:460px;max-width:92vw;}
.gate-user{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:border-color .12s;}
.gate-user:hover{border-color:var(--amber);}

/* gantt */
.gantt-wrap{overflow-x:auto;overflow-y:hidden;border:1px solid var(--border);border-radius:10px;position:relative;}
.gantt-grid{display:grid;}
.gantt-head-cell{position:sticky;top:0;left:0;z-index:9;background:var(--panel);border-right:1px solid var(--border);border-bottom:1px solid var(--border);box-sizing:border-box;display:flex;align-items:center;padding:0 10px;font-weight:700;font-size:0.72rem;color:var(--text-faint);text-transform:uppercase;}
.gantt-head-resizable{resize:horizontal;overflow:auto;min-width:120px;max-width:520px;}
.gantt-day{position:sticky;top:0;z-index:7;background:var(--panel);border-right:1px solid var(--border);border-bottom:1px solid var(--border);box-sizing:border-box;text-align:center;font-size:0.6rem;color:var(--text-faint);padding:6px 0;font-family:var(--font-mono);}
.gantt-day.weekend{background:rgba(128,128,128,0.06);}
.gantt-day.holiday{background:var(--red-dim);color:var(--red);}
.gantt-label-col{position:sticky;left:0;z-index:5;background:var(--panel);border-right:1px solid var(--border);border-bottom:1px solid var(--border);box-sizing:border-box;padding:0 10px;font-size:0.78rem;display:flex;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gantt-cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);box-sizing:border-box;position:relative;}
.gantt-cell.weekend{background:rgba(128,128,128,0.06);}
.gantt-cell.holiday{background:var(--red-dim);opacity:0.5;}
.gantt-cell.has-remark::after{content:'';position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 3px rgba(0,0,0,0.6);}

.comment-item{padding:10px;border-radius:8px;background:var(--panel-2);margin-bottom:8px;}
.comment-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.vis-toggle{display:flex;gap:6px;margin-bottom:10px;}
.vis-toggle button{flex:1;}
.vis-toggle button.active{background:var(--amber);color:#1a1204;border-color:var(--amber);}

.announce-card{border-left:3px solid var(--amber);background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:10px;padding:16px;margin-bottom:12px;}
.announce-card.pinned{border-left-color:var(--red);}

/* chat */
.chat-shell{display:flex;height:calc(100vh - 140px);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--panel);}
.chat-channel-list{width:220px;flex-shrink:0;border-right:1px solid var(--border);padding:14px 10px;overflow-y:auto;background:var(--panel-2);}
.chat-channel-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:0.83rem;color:var(--text-dim);margin-bottom:2px;}
.chat-channel-item:hover{background:var(--panel);}
.chat-channel-item.active{background:var(--panel);color:var(--text);font-weight:600;}
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0;}
.chat-header{padding:12px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:0.92rem;}
.chat-messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px;}
.chat-msg{display:flex;gap:10px;max-width:74%;}
.chat-msg.mine{align-self:flex-end;flex-direction:row-reverse;}
.chat-bubble{background:var(--panel-2);padding:9px 13px;border-radius:12px;font-size:0.85rem;}
.chat-msg.mine .chat-bubble{background:var(--amber);color:#1a1204;}
.chat-meta-line{font-size:0.66rem;color:var(--text-faint);margin-bottom:3px;}
.chat-input-row{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;}
.chat-input-row input{flex:1;}

/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.cal-cell{background:var(--panel);min-height:96px;padding:8px;cursor:pointer;transition:background .12s;}
.cal-cell:hover{background:var(--panel-2);}
.cal-cell.other-month{opacity:0.35;}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--amber);}
.cal-daynum{font-size:0.78rem;font-weight:700;font-family:var(--font-mono);margin-bottom:6px;}
.cal-chip{font-size:0.62rem;font-weight:600;padding:2px 6px;border-radius:5px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;}
.cal-dow{background:var(--panel-2);padding:8px;text-align:center;font-size:0.68rem;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.05em;}

/* excel-style cell edit popover sections */
.cell-edit-section{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px;}
.color-swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;flex-shrink:0;}
</style>
</head>
<body>

<div id="identityGate"></div>

<div id="shell" style="display:none;">
  <div id="sidebar"></div>
  <div id="main">
    <div id="topbar"></div>
    <div id="content"></div>
  </div>
</div>

<div id="modalRoot"></div>

<script>
/* =========================================================
   RELAY — Phase 1
   Data model lives in shared storage (visible to whole team)
   ========================================================= */

const HOLIDAYS = {
  "2026-01-01":"New Year's Day","2026-05-01":"Labour Day",
  "2026-08-31":"Merdeka Day","2026-09-16":"Malaysia Day","2026-12-25":"Christmas Day"
};

const AVATAR_COLORS = ["#f2a63d","#4d8dff","#3ecf8e","#a78bfa","#f2555a","#38bdf8","#fb923c","#e879f9"];

let DB = { users: [], org: { settings:{ kickoffDate:"2026-07-01", bufferFactor:0.8 }, projects: [], teams: [] }, announcements: [], chat: { customChannels: [], messages: {} }, calendarEvents: [], trainings: [], accessDirectory: [] };
const DEFAULT_TEAMS = ["AI Team","RPA Team","Web Team","Support Team"];
let ME = null; // current user id
let VIEW = 'dashboard';
let ACTIVE_PROJECT = null;
let THEME = 'dark';
if(typeof pdfjsLib !== 'undefined'){ pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }
let GANTT_STATE = {}; // projectId -> { teamFilter, range }
const GANTT_DAY_W = 30;
function getGanttState(pid){
  if(!GANTT_STATE[pid]) GANTT_STATE[pid] = { teamFilter: null, range: 'quarter', labelWidth: 210 };
  return GANTT_STATE[pid];
}
function endOfQuarter(d){ const q = Math.floor(d.getMonth()/3); return new Date(d.getFullYear(), q*3+3, 0); }

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function colorFor(id){ let h=0; for(const c of id) h = (h*31 + c.charCodeAt(0))>>>0; return AVATAR_COLORS[h % AVATAR_COLORS.length]; }
function avatarHtml(user, size, extraStyle){
  const sizeClass = size==='sm' ? ' sm' : '';
  const bg = user ? colorFor(user.id) : '#5b6472';
  const label = user ? initials(user.name) : '?';
  return `<div class="avatar${sizeClass}" style="background:${bg};${extraStyle||''}">${label}</div>`;
}
function initials(name){ return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function isWorkingDay(d){ if(d.getDay()===0||d.getDay()===6) return false; if(HOLIDAYS[isoDate(d)]) return false; return true; }
function isoDate(d){ return d.toISOString().split('T')[0]; }
function stripTime(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function fmtDate(d){ if(!d) return '—'; const dt = typeof d==='string'? new Date(d):d; return dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }

/* ---------------- storage ---------------- */
// Nyamuk can run two ways: (1) inside a Claude.ai artifact, where window.storage
// gives real shared/team storage, or (2) as a plain local HTML file (e.g.
// double-clicked from disk), where window.storage doesn't exist at all. In that
// second case we fall back to the browser's own localStorage so nothing is lost
// -- it just lives on this one computer/browser instead of being shared with the team.
const CLOUD_STORAGE_AVAILABLE = (typeof window !== 'undefined' && !!window.storage);
const LOCAL_PREFIX = 'relay:';

async function storageGet(key){
  if(CLOUD_STORAGE_AVAILABLE){
    try{ return await window.storage.get(key, true); }catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem(LOCAL_PREFIX+key);
    return raw===null ? null : { value: raw };
  }catch(e){ return null; }
}
async function storageSet(key, value){
  if(CLOUD_STORAGE_AVAILABLE){
    try{ await window.storage.set(key, value, true); }catch(e){ console.error(e); }
    return;
  }
  try{ localStorage.setItem(LOCAL_PREFIX+key, value); }catch(e){ console.error(e); }
}
// identity is intentionally personal even in cloud mode (shared:false there),
// and always local-only when running as a plain file (there's no "other browser" to share with anyway)
async function identityGet(){
  if(CLOUD_STORAGE_AVAILABLE){
    try{ return await window.storage.get('my-identity', false); }catch(e){ return null; }
  }
  try{ const raw = localStorage.getItem(LOCAL_PREFIX+'my-identity'); return raw===null?null:{value:raw}; }catch(e){ return null; }
}
async function identitySet(userId){
  const payload = JSON.stringify({userId});
  if(CLOUD_STORAGE_AVAILABLE){
    try{ await window.storage.set('my-identity', payload, false); }catch(e){ console.error(e); }
    return;
  }
  try{ localStorage.setItem(LOCAL_PREFIX+'my-identity', payload); }catch(e){ console.error(e); }
}

async function loadDB(){
  try{
    const u = await storageGet('org-users');
    if(u) DB.users = JSON.parse(u.value);
  }catch(e){ DB.users = []; }
  try{
    const o = await storageGet('org-data');
    if(o) DB.org = JSON.parse(o.value);
  }catch(e){ /* keep defaults */ }
  try{
    const a = await storageGet('org-announcements');
    if(a) DB.announcements = JSON.parse(a.value);
  }catch(e){ DB.announcements = []; }
  try{
    const c = await storageGet('org-chat');
    if(c) DB.chat = JSON.parse(c.value);
  }catch(e){ /* keep defaults */ }
  try{
    const cal = await storageGet('org-calendar');
    if(cal) DB.calendarEvents = JSON.parse(cal.value);
  }catch(e){ DB.calendarEvents = []; }
  try{
    const tr = await storageGet('org-trainings');
    if(tr) DB.trainings = JSON.parse(tr.value);
  }catch(e){ DB.trainings = []; }
  try{
    const ac = await storageGet('org-access');
    if(ac) DB.accessDirectory = JSON.parse(ac.value);
  }catch(e){ DB.accessDirectory = []; }
  try{
    const me = await identityGet();
    if(me) ME = JSON.parse(me.value).userId;
  }catch(e){ ME = null; }

  // backwards-compat / seeding
  if(!DB.org.teams || !DB.org.teams.length){
    DB.org.teams = DEFAULT_TEAMS.map(name=>({ id: uid('tm'), name, }));
    await saveOrg();
  }
  DB.org.projects.forEach(p=>{ if(!p.teamIds) p.teamIds = []; if(!p.checkpoints) p.checkpoints = []; });
  DB.users.forEach(u=>{ if(u.teamId===undefined) u.teamId = null; });
}
async function saveUsers(){ await storageSet('org-users', JSON.stringify(DB.users)); }
async function saveOrg(){ await storageSet('org-data', JSON.stringify(DB.org)); }
async function saveAnnouncements(){ await storageSet('org-announcements', JSON.stringify(DB.announcements)); }
async function saveChat(){ await storageSet('org-chat', JSON.stringify(DB.chat)); }
async function saveCalendar(){ await storageSet('org-calendar', JSON.stringify(DB.calendarEvents)); }
async function saveTrainings(){ await storageSet('org-trainings', JSON.stringify(DB.trainings)); }
async function saveAccessDirectory(){ await storageSet('org-access', JSON.stringify(DB.accessDirectory)); }
async function saveIdentity(userId){ await identitySet(userId); }

function me(){ return DB.users.find(u=>u.id===ME); }
function isLeader(){ const m = me(); return m && m.role === 'leader'; }
function isExec(){ const m = me(); return m && m.role === 'exec'; }
function userById(id){ return DB.users.find(u=>u.id===id); }

/* ================= INIT ================= */
(async function init(){
  await loadDB();
  if(!ME || !userById(ME)){
    renderIdentityGate();
  } else {
    enterApp();
  }
})();

/* ================= IDENTITY GATE ================= */
function renderIdentityGate(){

async function selectIdentity(userId){
  ME = userId;
  await saveIdentity(userId);
  document.getElementById('identityGate').style.display='none';
  enterApp();
}
async function createIdentity(){
  const name = document.getElementById('gateName').value.trim();
  const title = document.getElementById('gateTitle').value.trim();
  if(!name) return;
  const isFirst = DB.users.length === 0;
  const teamId = document.getElementById('gateTeam').value || null;
  const newUser = { id: uid('u'), name, title, role: isFirst ? 'leader' : 'member', teamId };
  DB.users.push(newUser);
  await saveUsers();
  ME = newUser.id;
  await saveIdentity(ME);
  document.getElementById('identityGate').style.display='none';
  enterApp();
}

/* ================= HELPERS: task flattening & scheduling ================= */
function allTasks(){
  const out = [];
  DB.org.projects.forEach(p=>p.blocks.forEach(b=>b.tasks.forEach(t=>out.push({...t, projectId:p.id, projectName:p.name, blockId:b.id, blockLabel:b.label}))));
  return out;
}
function findTaskRef(taskId){
  for(const p of DB.org.projects) for(const b of p.blocks) for(const t of b.tasks) if(t.id===taskId) return {p,b,t};
  return null;
}
const PRI_WEIGHT = { urgent:4, high:3, med:2, low:1 };

function computeSchedule(){
  const kickoff = new Date(DB.org.settings.kickoffDate);
  const maxDaily = 8 * (DB.org.settings.bufferFactor || 0.8);
  const flat = allTasks();
  const byId = {}; flat.forEach(t=>byId[t.id]=t);
  const indeg = {}; flat.forEach(t=>indeg[t.id] = (t.dependencies||[]).filter(d=>byId[d]).length);
  const done = new Set();
  const ready = flat.filter(t=>indeg[t.id]===0);
  const assigneeState = {};
  const endDates = {};

  function pickNext(list){
    list.sort((a,b)=> (PRI_WEIGHT[b.priority]||1)-(PRI_WEIGHT[a.priority]||1));
    return list.shift();
  }
  while(ready.length){
    const task = pickNext(ready);
    if(done.has(task.id)) continue;
    const assignee = task.assignee || 'unassigned';
    let st = assigneeState[assignee] || { cursor: new Date(kickoff), remaining: 0 };

    if(task.manualStart && task.manualEnd){
      // pinned by the user directly on the timeline/task row -- skip auto-allocation
      task._start = new Date(task.manualStart);
      task._end = new Date(task.manualEnd);
      endDates[task.id] = task._end;
      const dayAfter = new Date(task._end); dayAfter.setDate(dayAfter.getDate()+1);
      if(st.cursor < dayAfter){ st.cursor = new Date(dayAfter); st.remaining = 0; }
      assigneeState[assignee] = st;
      done.add(task.id);
      flat.forEach(t2=>{
        if((t2.dependencies||[]).includes(task.id)){
          indeg[t2.id]--;
          if(indeg[t2.id]===0 && !done.has(t2.id) && !ready.includes(t2)) ready.push(t2);
        }
      });
      continue;
    }

    let depEnd = kickoff;
    (task.dependencies||[]).forEach(dId=>{ if(endDates[dId] && endDates[dId] > depEnd) depEnd = endDates[dId]; });
    if(st.cursor < depEnd){ st.cursor = new Date(depEnd); st.remaining = 0; }

    let hoursLeft = task.hours || 0;
    let startDate = null, lastUsed = new Date(st.cursor);
    if(hoursLeft === 0){ startDate = new Date(st.cursor); lastUsed = new Date(st.cursor); }
    while(hoursLeft > 0){
      while(st.remaining <= 0){
        if(isWorkingDay(st.cursor)){ st.remaining = maxDaily; break; }
        st.cursor.setDate(st.cursor.getDate()+1);
      }
      if(!startDate) startDate = new Date(st.cursor);
      lastUsed = new Date(st.cursor);
      if(hoursLeft >= st.remaining){ hoursLeft -= st.remaining; st.remaining = 0; st.cursor.setDate(st.cursor.getDate()+1); }
      else { st.remaining -= hoursLeft; hoursLeft = 0; }
    }
    task._start = startDate || new Date(st.cursor);
    task._end = lastUsed;
    endDates[task.id] = lastUsed;
    assigneeState[assignee] = st;
    done.add(task.id);

    flat.forEach(t2=>{
      if((t2.dependencies||[]).includes(task.id)){
        indeg[t2.id]--;
        if(indeg[t2.id]===0 && !done.has(t2.id) && !ready.includes(t2)) ready.push(t2);
      }
    });
  }
  return flat;
}

/* ================= DASHBOARD ================= */
function renderDashboard(){
  const scheduled = computeSchedule();
  const total = scheduled.length;
  const done = scheduled.filter(t=>t.status==='done').length;
  const inprogress = scheduled.filter(t=>t.status==='inprogress').length;
  const blocked = scheduled.filter(t=>t.status==='blocked').length;
  const crs = scheduled.filter(t=>t.isCR).length;
  const pct = total ? Math.round(done/total*100) : 0;

  const byProject = DB.org.projects.map(p=>{
    const tks = scheduled.filter(t=>t.projectId===p.id);
    const d = tks.filter(t=>t.status==='done').length;
    return { p, total: tks.length, done: d, pct: tks.length ? Math.round(d/tks.length*100):0 };
  });

  const byTeam = DB.org.teams.map(tm=>{
    const memberIds = DB.users.filter(u=>u.teamId===tm.id).map(u=>u.id);
    const tks = scheduled.filter(t=>memberIds.includes(t.assignee));
    const d = tks.filter(t=>t.status==='done').length;
    return { tm, total: tks.length, done: d, pct: tks.length ? Math.round(d/tks.length*100):0, members: memberIds.length };
  });

  const crTasks = scheduled.filter(t=>t.isCR).sort((a,b)=>a._end-b._end);

  const upcoming = scheduled.filter(t=>t.status!=='done').sort((a,b)=>a._end-b._end).slice(0,6);

  const visibleForMe = isLeader() || isExec() ? scheduled : scheduled.filter(t=>t.assignee===ME);

  const workload = {};
  scheduled.forEach(t=>{ if(t.status!=='done'){ const k=t.assignee||'unassigned'; workload[k]=(workload[k]||0)+ (t.hours||0);} });

  return `
    <div class="grid grid-4" style="margin-bottom:20px;">
      ${statCard('Total tasks', total, 'blue','▤')}
      ${statCard('Completed', `${done} <span style="font-size:0.9rem;color:var(--text-faint);">(${pct}%)</span>`, 'green','✔')}
      ${statCard('In progress / blocked', `${inprogress} / ${blocked}`, blocked>0?'red':'amber','◐')}
      ${statCard('Change requests', crs, 'purple','⚑')}
    </div>

    <div class="grid grid-2" style="align-items:start;">
      <div class="card">
        <div class="card-title">Project progress</div>
        ${byProject.length ? byProject.map(x=>`
          <div style="margin-bottom:14px;">
            <div style="display:flex;justify-content:space-between;font-size:0.83rem;margin-bottom:6px;">
              <span style="font-weight:600;cursor:pointer;" onclick="switchView('planner','${x.p.id}')">${x.p.name}</span>
              <span class="mono" style="color:var(--text-dim);">${x.done}/${x.total} · ${x.pct}%</span>
            </div>
            <div class="progress-track"><div class="progress-fill" style="width:${x.pct}%;"></div></div>
          </div>
        `).join('') : emptyState('◆','No projects yet','Create one from the Task Planner tab.')}
      </div>

      <div class="card">
        <div class="card-title">${isLeader()||isExec() ? 'Upcoming deadlines (all)' : 'Your upcoming deadlines'}</div>
        ${(isLeader()||isExec()? upcoming : upcoming.filter(t=>t.assignee===ME)).length ?
          (isLeader()||isExec()? upcoming: upcoming.filter(t=>t.assignee===ME)).map(t=>`
            <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
              <span class="signal ${statusColor(t.status)}"></span>
              <div style="flex:1;overflow:hidden;">
                <div style="font-size:0.83rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${t.name}</div>
                <div style="font-size:0.7rem;color:var(--text-faint);">${t.projectName} · ${userById(t.assignee)?.name || 'Unassigned'}</div>
              </div>
              <span class="mono" style="font-size:0.76rem;color:var(--text-dim);">${fmtDate(t._end)}</span>
            </div>
          `).join('') : emptyState('✔','Nothing pending','You are all caught up.')}
      </div>
    </div>

    ${ (isLeader()||isExec()) ? `
    <div class="card" style="margin-top:16px;">
      <div class="card-title">Team workload (open hours)</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;">
        ${Object.keys(workload).length ? Object.entries(workload).sort((a,b)=>b[1]-a[1]).map(([uidKey,hrs])=>{
          const u = userById(uidKey);
          const name = u ? u.name : 'Unassigned';
          return `<div style="display:flex;align-items:center;gap:8px;background:var(--panel-2);padding:8px 12px;border-radius:10px;">
            ${avatarHtml(u,'sm')}
            <div style="font-size:0.8rem;">${name}</div>
            <div class="mono" style="font-size:0.76rem;color:var(--text-dim);">${hrs}h</div>
          </div>`;
        }).join('') : emptyState('◍','No open workload','')}
      </div>
      ${!isLeader() ? '' : `<div style="margin-top:10px;font-size:0.76rem;color:var(--text-faint);">Tip: someone free? Assign them a task from the Task Planner tab.</div>`}
    </div>

    <div class="grid grid-2" style="margin-top:16px;align-items:start;">
      <div class="card">
        <div class="card-title">Progress by team</div>
        ${byTeam.length ? byTeam.map(x=>`
          <div style="margin-bottom:14px;">
            <div style="display:flex;justify-content:space-between;font-size:0.83rem;margin-bottom:6px;">
              <span style="font-weight:600;">${x.tm.name} <span style="color:var(--text-faint);font-weight:400;">(${x.members})</span></span>
              <span class="mono" style="color:var(--text-dim);">${x.done}/${x.total} · ${x.pct}%</span>
            </div>
            <div class="progress-track"><div class="progress-fill" style="width:${x.pct}%;"></div></div>
          </div>
        `).join('') : emptyState('◍','No teams yet','')}
      </div>
      <div class="card">
        <div class="card-title">Change requests (${crTasks.length})</div>
        ${crTasks.length ? crTasks.slice(0,8).map(t=>`
          <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
            <span class="chip status-${t.status}">${t.status}</span>
            <div style="flex:1;overflow:hidden;">
              <div style="font-size:0.83rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;" onclick="switchView('planner','${t.projectId}')">${t.name}</div>
              <div style="font-size:0.7rem;color:var(--text-faint);">${t.projectName} · ${userById(t.assignee)?.name || 'Unassigned'}</div>
            </div>
            <span class="mono" style="font-size:0.76rem;color:var(--text-dim);">${fmtDate(t._end)}</span>
          </div>
        `).join('') : emptyState('⚑','No change requests','Nothing flagged right now.')}
      </div>
    </div>
    ` : ''}
  `;
}
function statCard(label,val,color,ic){
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;">
    <div><div class="card-title" style="margin-bottom:8px;">${label}</div><div style="font-size:1.7rem;font-weight:700;font-family:var(--font-display);">${val}</div></div>
    <span class="signal ${color}" style="margin-top:4px;"></span>
  </div></div>`;
}
function statusColor(s){ return s==='done'?'green':s==='blocked'?'red':s==='inprogress'?'blue':'grey'; }
function emptyState(ic,title,sub){ return `<div class="empty-state"><div class="ic">${ic}</div><div style="font-weight:600;color:var(--text-dim);">${title}</div><div style="font-size:0.8rem;">${sub}</div></div>`; }

/* ================= PLANNER ================= */
function renderPlanner(){
  if(!ACTIVE_PROJECT && DB.org.projects.length){ ACTIVE_PROJECT = DB.org.projects[0].id; }
  const project = DB.org.projects.find(p=>p.id===ACTIVE_PROJECT);
  if(!DB.org.projects.length){
    return `<div class="card">${emptyState('◆','No projects yet', isLeader()? "Click “New project” up top to create your first one." : "Ask your team leader to create a project.")}</div>`;
  }
  if(!project) return `<div class="card">${emptyState('◆','Pick a project','Choose one from the sidebar.')}</div>`;

  const scheduled = computeSchedule();
  const allInProject = scheduled.filter(t=>t.projectId===project.id);
  const gState = getGanttState(project.id);

  const projectTeams = (project.teamIds||[]).map(id=>DB.org.teams.find(t=>t.id===id)).filter(Boolean);
  const tasksInProject = gState.teamFilter
    ? allInProject.filter(t=>{ const u = userById(t.assignee); return u && u.teamId===gState.teamFilter; })
    : allInProject;

  return `
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <h2 style="margin:0;">${project.name}</h2>
          <p style="color:var(--text-dim);font-size:0.85rem;margin:4px 0 0 0;">${project.description||''}</p>
          <div style="display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap;">
            ${(project.teamIds||[]).length ? (project.teamIds||[]).map(tid=>{
              const t = DB.org.teams.find(x=>x.id===tid);
              return t ? `<span class="chip" style="background:var(--panel-2);color:var(--text-dim);">${t.name}</span>` : '';
            }).join('') : `<span class="chip" style="background:var(--panel-2);color:var(--text-faint);">No team assigned</span>`}
            ${isLeader() ? `<button class="btn btn-ghost btn-sm" onclick="openEditProjectTeams('${project.id}')">✎ edit teams</button>` : ''}
          </div>
          ${projectTeams.length > 1 ? `
          <div style="display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap;">
            <span style="font-size:0.7rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.05em;font-weight:700;">Filter:</span>
            <button class="btn btn-sm ${!gState.teamFilter?'btn-primary':'btn-outline'}" onclick="setTeamFilter('${project.id}', null)">All teams</button>
            ${projectTeams.map(t=>`<button class="btn btn-sm ${gState.teamFilter===t.id?'btn-primary':'btn-outline'}" onclick="setTeamFilter('${project.id}', '${t.id}')">${t.name}</button>`).join('')}
          </div>` : ''}

function renderGantt(tasks, project){
  const kickoff = new Date(DB.org.settings.kickoffDate);
  const checkpoints = project.checkpoints || [];
  const state = getGanttState(project.id);
  const rangeMode = state.range || 'quarter';
  const labelWidth = state.labelWidth || 210;

  let baseEnd;
  if(rangeMode==='month') baseEnd = new Date(kickoff.getFullYear(), kickoff.getMonth()+1, 0);
  else if(rangeMode==='year') baseEnd = new Date(kickoff.getFullYear(), 11, 31);
  else if(rangeMode==='fit') baseEnd = kickoff;
  else baseEnd = endOfQuarter(kickoff); // 'quarter' default

  let maxEnd = new Date(baseEnd);
  tasks.forEach(t=>{ if(t._end>maxEnd) maxEnd = new Date(t._end); });
  checkpoints.forEach(cp=>{ const d = new Date(cp.dateIso); if(d>maxEnd) maxEnd = d; });

  const days = [];
  let cur = new Date(kickoff);
  while(cur <= maxEnd){ days.push(new Date(cur)); cur.setDate(cur.getDate()+1); }
  const dayW = GANTT_DAY_W;

  // one grid, one set of column tracks shared by the header row and every task row --
  // this guarantees every row's columns line up with the header, by construction.
  let cellsHtml = `<div class="gantt-head-cell gantt-head-resizable" style="grid-column:1;grid-row:1;">Task</div>`;
  days.forEach((d,i)=>{
    const iso = isoDate(d);
    const cls = HOLIDAYS[iso] ? 'holiday' : (d.getDay()===0||d.getDay()===6) ? 'weekend' : '';
    const cp = checkpoints.find(c=>c.dateIso===iso);
    cellsHtml += `<div class="gantt-day ${cls}" style="grid-column:${i+2};grid-row:1;cursor:pointer;" onclick="openCheckpointModal('${project.id}','${iso}')" title="Click to add/edit a checkpoint">
      ${cp?`<div style="position:absolute;left:50%;top:2px;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:${cp.color};box-shadow:0 0 6px ${cp.color};"></div>`:''}
      ${d.getDate()}
    </div>`;
  });

  tasks.forEach((t, rowIdx)=>{
    const gridRow = rowIdx + 2;
    const statusColor = t.status==='done'?'var(--green)': t.status==='blocked'?'var(--red)': t.isCR ? 'var(--purple)' : 'var(--amber)';
    const startTime = stripTime(t._start).getTime();
    const endTime = stripTime(t._end).getTime();
    const editable = canEditTask(t);
    cellsHtml += `<div class="gantt-label-col" style="grid-column:1;grid-row:${gridRow};cursor:pointer;" onclick="openTaskDetail('${t.id}')">${t.manualStart&&t.manualEnd?'📌 ':''}${t.name}</div>`;
    days.forEach((d,i)=>{
      const iso = isoDate(d);
      const cls = HOLIDAYS[iso] ? 'holiday' : (d.getDay()===0||d.getDay()===6) ? 'weekend' : '';
      const inRange = d.getTime() >= startTime && d.getTime() <= endTime;
      const override = (t.overrides && t.overrides[iso]) || '';
      const bg = override || (inRange ? statusColor : '');
      const style = bg ? `background:${bg};` : '';
      const remark = t.cellRemarks && t.cellRemarks[iso];
      const remarkCls = remark ? ' has-remark' : '';
      const clickAttr = editable ? `onclick="openGanttCellEdit('${t.id}','${iso}','${isoDate(t._start)}','${isoDate(t._end)}')" style="grid-column:${i+2};grid-row:${gridRow};${style}cursor:pointer;"` : `style="grid-column:${i+2};grid-row:${gridRow};${style}"`;
      const titleText = remark ? escapeHtml(remark) : (inRange ? t.name : (editable ? 'Click to edit this day' : ''));
      cellsHtml += `<div class="gantt-cell ${cls}${remarkCls}" ${clickAttr} title="${titleText}"></div>`;
    });
  });

  const bodyHeight = tasks.length * 40;
  const needles = checkpoints.map(cp=>{
    const offset = Math.round((new Date(cp.dateIso) - kickoff)/86400000);
    return `
      <div class="gantt-needle-line" data-offset="${offset}" style="position:absolute;top:34px;left:${labelWidth + offset*dayW + dayW/2}px;width:0;height:${bodyHeight}px;border-left:2px dashed ${cp.color};pointer-events:none;z-index:8;"></div>
      <div class="gantt-needle-label" data-offset="${offset}" style="position:absolute;top:37px;left:${labelWidth + offset*dayW + dayW/2 + 4}px;font-size:0.62rem;font-weight:700;color:${cp.color};background:var(--panel);padding:1px 5px;border-radius:4px;white-space:nowrap;z-index:9;cursor:pointer;" onclick="openCheckpointModal('${project.id}','${cp.dateIso}')">📍 ${cp.label}</div>
    `;
  }).join('');

  return `
    <div class="gantt-wrap">
      <div class="gantt-grid" data-project-id="${project.id}" data-day-count="${days.length}" style="grid-template-columns:${labelWidth}px repeat(${days.length}, ${dayW}px);grid-template-rows:34px repeat(${tasks.length}, 40px);">
        ${cellsHtml}
      </div>
      ${needles}
    </div>
  `;
}
function initGanttResizers(){
  document.querySelectorAll('.gantt-grid').forEach(grid=>{
    const header = grid.querySelector('.gantt-head-resizable');
    if(!header || typeof ResizeObserver === 'undefined') return;
    const dayCount = parseInt(grid.dataset.dayCount, 10) || 0;
    const projectId = grid.dataset.projectId;
    const ro = new ResizeObserver(entries=>{
      const w = Math.max(120, Math.round(entries[0].contentRect.width));
      grid.style.gridTemplateColumns = `${w}px repeat(${dayCount}, ${GANTT_DAY_W}px)`;
      const wrap = grid.closest('.gantt-wrap');
      if(wrap){
        wrap.scrollLeft = 0;
        wrap.querySelectorAll('.gantt-needle-line').forEach(el=>{
          const offset = parseFloat(el.dataset.offset);
          el.style.left = (w + offset*GANTT_DAY_W + GANTT_DAY_W/2) + 'px';
        });
        wrap.querySelectorAll('.gantt-needle-label').forEach(el=>{
          const offset = parseFloat(el.dataset.offset);
          el.style.left = (w + offset*GANTT_DAY_W + GANTT_DAY_W/2 + 4) + 'px';
        });
      }
      if(projectId) getGanttState(projectId).labelWidth = w;
    });
    ro.observe(header);
  });
}

      </div>

/* ---- import module (beta): Excel/CSV + experimental PDF ---- */
let IMPORT_ROWS = [];
let IMPORT_PROJECT = null;

function openImportModal(projectId){
  IMPORT_PROJECT = projectId;
  IMPORT_ROWS = [];
  showModal(`
    <div class="modal-head"><h3>Import tasks <span class="chip" style="background:var(--purple-dim);color:var(--purple);">BETA</span></h3><button class="btn btn-ghost" onclick="closeModal()">✕</button></div>
    <div style="font-size:0.8rem;color:var(--text-dim);margin-bottom:14px;">
      Bring in tasks from a spreadsheet or a document instead of typing them one by one. Works best with a clear "Task / Hours / Assignee" style layout — review everything before confirming, nothing is saved until you click Import.
    </div>
    <div class="grid grid-2" style="margin-bottom:6px;">
      <div class="card" style="padding:14px;">
        <div class="card-title" style="margin-bottom:8px;">📊 Excel / CSV</div>
        <div style="font-size:0.74rem;color:var(--text-faint);margin-bottom:10px;">.xlsx, .xls, or .csv — reads the first sheet, looks for columns like Task, Hours, Assignee, Priority.</div>
        <input type="file" id="importExcelFile" accept=".xlsx,.xls,.csv" onchange="handleExcelImport(event)">
      </div>
      <div class="card" style="padding:14px;">
        <div class="card-title" style="margin-bottom:8px;">📄 PDF <span style="color:var(--text-faint);font-weight:400;text-transform:none;">(experimental)</span></div>
        <div style="font-size:0.74rem;color:var(--text-faint);margin-bottom:10px;">Text-based PDFs only (not scanned images). Extraction is rough — expect to clean up rows before importing.</div>
        <input type="file" id="importPdfFile" accept=".pdf" onchange="handlePdfImport(event)">
      </div>
    </div>
    <div id="importPreviewHolder"></div>
  `, 'modal-xl');
}

function guessColumnIndex(headerRow, patterns){
  for(let i=0;i<headerRow.length;i++){
    const cell = String(headerRow[i]||'').toLowerCase();
    if(patterns.some(p=>p.test(cell))) return i;
  }
  return -1;
}

async function handleExcelImport(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });

    let headerIdx = rows.findIndex(r => r.some(c=>/task|name/i.test(String(c))) && r.some(c=>/hour|effort/i.test(String(c))));
    if(headerIdx === -1) headerIdx = 0;
    const header = rows[headerIdx] || [];
    const nameCol = guessColumnIndex(header, [/task/i,/name/i]);
    const hoursCol = guessColumnIndex(header, [/hour/i,/effort/i]);
    const assigneeCol = guessColumnIndex(header, [/assign/i,/pic/i,/owner/i]);
    const priorityCol = guessColumnIndex(header, [/priorit/i]);
    const crCol = guessColumnIndex(header, [/\bcr\b/i,/change request/i]);

    const parsed = [];
    for(let i=headerIdx+1;i<rows.length;i++){
      const r = rows[i];
      if(!r || r.every(c=>String(c).trim()==='')) continue;
      const name = nameCol>-1 ? String(r[nameCol]||'').trim() : String(r[0]||'').trim();
      if(!name) continue;
      const hours = hoursCol>-1 ? parseFloat(r[hoursCol]) || 0 : 0;
      const assigneeText = assigneeCol>-1 ? String(r[assigneeCol]||'').trim() : '';
      const priorityText = priorityCol>-1 ? String(r[priorityCol]||'').trim().toLowerCase() : '';
      const isCR = crCol>-1 ? /^(y|yes|true|1)$/i.test(String(r[crCol]||'').trim()) : false;
      parsed.push(makeImportRow(name, hours, assigneeText, priorityText, isCR));
    }
    IMPORT_ROWS = parsed;
    renderImportPreview('Excel/CSV');
  }catch(err){
    console.error(err);
    document.getElementById('importPreviewHolder').innerHTML = `<div style="color:var(--red);font-size:0.83rem;">Couldn't read that file. Make sure it's a valid .xlsx/.xls/.csv.</div>`;
  }
}

async function handlePdfImport(e){
  const file = e.target.files[0];
  if(!file) return;
  if(typeof pdfjsLib === 'undefined'){
    document.getElementById('importPreviewHolder').innerHTML = `<div style="color:var(--red);font-size:0.83rem;">PDF engine didn't load (needs an internet connection). Try Excel/CSV instead.</div>`;
    return;
  }
  document.getElementById('importPreviewHolder').innerHTML = `<div style="font-size:0.83rem;color:var(--text-faint);">Reading PDF…</div>`;
  try{
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let lines = [];
    for(let p=1;p<=pdf.numPages;p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      let lastY = null, cur = '';
      content.items.forEach(item=>{
        const y = Math.round(item.transform[5]);
        if(lastY !== null && Math.abs(y-lastY) > 4){ if(cur.trim()) lines.push(cur.trim()); cur=''; }
        cur += item.str + ' ';
        lastY = y;
      });
      if(cur.trim()) lines.push(cur.trim());
    }
    const parsed = [];
    lines.forEach(line=>{
      const clean = line.trim();
      if(clean.length < 2) return;
      const m = clean.match(/^(.*?)[\s\-:,|]+(\d+(?:\.\d+)?)\s*h?(?:ours?)?\s*$/i);
      if(m && m[1].trim().length>1){
        parsed.push(makeImportRow(m[1].trim(), parseFloat(m[2]), '', '', false));
      } else if(!/^page \d+/i.test(clean)) {
        parsed.push(makeImportRow(clean, 0, '', '', false));
      }
    });
    IMPORT_ROWS = parsed.slice(0, 200);
    renderImportPreview('PDF (experimental)');
  }catch(err){
    console.error(err);
    document.getElementById('importPreviewHolder').innerHTML = `<div style="color:var(--red);font-size:0.83rem;">Couldn't read that PDF — it may be a scanned image rather than real text. Try Excel/CSV instead.</div>`;
  }
}

function makeImportRow(name, hours, assigneeText, priorityText, isCR){
  const matchedUser = assigneeText ? DB.users.find(u=>u.name.toLowerCase()===assigneeText.toLowerCase() || u.name.toLowerCase().includes(assigneeText.toLowerCase())) : null;
  const validPriorities = ['low','med','high','urgent'];
  let priority = 'med';
  if(priorityText){
    if(/urg/.test(priorityText)) priority='urgent';
    else if(/high/.test(priorityText)) priority='high';
    else if(/low/.test(priorityText)) priority='low';
    else if(validPriorities.includes(priorityText)) priority = priorityText;
  }
  return { include:true, name, hours: hours||0, assignee: matchedUser?matchedUser.id:'', priority, isCR: !!isCR, rawAssigneeText: assigneeText };
}

function renderImportPreview(sourceLabel){
  const holder = document.getElementById('importPreviewHolder');
  if(!IMPORT_ROWS.length){
    holder.innerHTML = `<div style="color:var(--text-faint);font-size:0.83rem;">Nothing detected in that file. You can still add tasks manually.</div>`;
    return;
  }
  holder.innerHTML = `
    <div class="card-title" style="margin-top:10px;">Preview from ${sourceLabel} — review before importing (${IMPORT_ROWS.length} rows)</div>
    <div style="max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;">
      <table>
        <thead><tr><th></th><th>Task name</th><th>Hours</th><th>Assignee</th><th>Priority</th><th>CR</th></tr></thead>
        <tbody id="importRowsBody">
          ${IMPORT_ROWS.map((r,i)=>`
            <tr>
              <td><input type="checkbox" ${r.include?'checked':''} onchange="IMPORT_ROWS[${i}].include=this.checked"></td>
              <td><input value="${r.name.replace(/"/g,'&quot;')}" oninput="IMPORT_ROWS[${i}].name=this.value" style="min-width:180px;"></td>
              <td><input type="number" step="0.5" value="${r.hours}" style="width:70px;" oninput="IMPORT_ROWS[${i}].hours=parseFloat(this.value)||0"></td>
              <td>
                <select onchange="IMPORT_ROWS[${i}].assignee=this.value" style="min-width:130px;">
                  <option value="">Unassigned${r.rawAssigneeText?' ('+r.rawAssigneeText+'?)':''}</option>
                  ${DB.users.map(u=>`<option value="${u.id}" ${r.assignee===u.id?'selected':''}>${u.name}</option>`).join('')}
                </select>
              </td>
              <td>
                <select onchange="IMPORT_ROWS[${i}].priority=this.value" style="min-width:90px;">
                  ${['low','med','high','urgent'].map(p=>`<option value="${p}" ${r.priority===p?'selected':''}>${p}</option>`).join('')}
                </select>
              </td>
              <td><input type="checkbox" ${r.isCR?'checked':''} onchange="IMPORT_ROWS[${i}].isCR=this.checked"></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:12px;" onclick="commitImport()">📥 Import checked rows</button>
  `;
}

function commitImport(){
  const project = DB.org.projects.find(p=>p.id===IMPORT_PROJECT);
  if(!project) return;
  const toAdd = IMPORT_ROWS.filter(r=>r.include && r.name.trim());
  if(!toAdd.length) return;
  toAdd.forEach(r=>{
    project.blocks[0].tasks.push({
      id: uid('tk'), name: r.name.trim(), hours: r.hours||0, priority: r.priority||'med',
      assignee: r.assignee || null, dependencies: [], isCR: !!r.isCR, status:'todo', remark:'', comments:[]
    });
  });
  saveOrg();
  IMPORT_ROWS = [];
  closeModal();
  renderView();
}

function listMyDMs(){
  const ids = Object.keys(DB.chat.messages||{}).filter(k=>k.startsWith('dm:') && k.includes(ME));
  return ids.map(id=>{
    const otherId = id.replace('dm:','').split('_').find(x=>x!==ME);

function renderChat(){
  const channels = listChannelsForUser();
  const dms = listMyDMs();
  if(!channels.find(c=>c.id===ACTIVE_CHANNEL) && !dms.find(d=>d.id===ACTIVE_CHANNEL)) ACTIVE_CHANNEL = 'general';
  const msgs = (DB.chat.messages && DB.chat.messages[ACTIVE_CHANNEL]) || [];
  const activeLabel = [...channels, ...dms].find(c=>c.id===ACTIVE_CHANNEL)?.label || 'General';

  return `
    <div class="chat-shell">

      </div>

        </div>

        </div>

function renderChatMsg(m){
  const u = userById(m.author);
  const mine = m.author === ME;
  return `<div class="chat-msg ${mine?'mine':''}">
    ${avatarHtml(u,'sm','flex-shrink:0;')}

      <div class="chat-meta-line" style="text-align:${mine?'right':'left'};">${u?u.name:'Unknown'} · ${new Date(m.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
      <div class="chat-bubble">${escapeHtml(m.body)}</div>

  </div>`;
}
function escapeHtml(s){ const d=document.createElement('div'); d.innerText=s; return d.innerHTML; }
function openChatChannel(id){ ACTIVE_CHANNEL = id; renderView(); }
function sendChatMessage(){
  const input = document.getElementById('chatInput');
  const body = input.value.trim();
  if(!body) return;
  DB.chat.messages = DB.chat.messages || {};
  DB.chat.messages[ACTIVE_CHANNEL] = DB.chat.messages[ACTIVE_CHANNEL] || [];

  saveChat();
  input.value = '';

/* ================= CALENDAR ================= */
let CAL_CURSOR = new Date(DB.org.settings.kickoffDate || Date.now());
CAL_CURSOR.setDate(1);

function calendarItemsForDate(iso){
  const items = [];
  const canSeeAll = isLeader() || isExec();
  const scheduled = computeSchedule();
  scheduled.forEach(t=>{
    if(!canSeeAll && t.assignee!==ME) return;
    if(t._end && isoDate(t._end)===iso) items.push({ type:'task', color: t.status==='done'?'var(--green)':t.status==='blocked'?'var(--red)':'var(--amber)', label:'📌 '+t.name, ref:t });
  });
  DB.org.projects.forEach(p=>(p.checkpoints||[]).forEach(cp=>{
    if(cp.dateIso===iso) items.push({ type:'checkpoint', color:cp.color, label:'📍 '+cp.label+' · '+p.name, ref:cp });
  }));
  (DB.calendarEvents||[]).forEach(ev=>{
    if(ev.date===iso && (canSeeAll || !ev.attendees.length || ev.attendees.includes(ME))) items.push({ type:'event', color:'var(--blue)', label:'🗓 '+(ev.time?ev.time+' ':'')+ev.title, ref:ev });
  });
  return items;
}

function renderCalendar(){
  const year = CAL_CURSOR.getFullYear(), month = CAL_CURSOR.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startDow = firstOfMonth.getDay();
  const gridStart = new Date(year, month, 1 - startDow);
  const todayIso = isoDate(new Date());
  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  let cells = '';
  let cur = new Date(gridStart);
  for(let i=0;i<42;i++){
    const iso = isoDate(cur);
    const inMonth = cur.getMonth()===month;
    const items = calendarItemsForDate(iso);
    cells += `<div class="cal-cell ${inMonth?'':'other-month'} ${iso===todayIso?'today':''}" onclick="openDayModal('${iso}')">
      <div class="cal-daynum">${cur.getDate()}${HOLIDAYS[iso]?' 🛑':''}</div>
      ${items.slice(0,3).map(it=>`<span class="cal-chip" style="background:${it.color};color:#fff;">${it.label}</span>`).join('')}
      ${items.length>3?`<div style="font-size:0.62rem;color:var(--text-faint);">+${items.length-3} more</div>`:''}
    </div>`;
    cur.setDate(cur.getDate()+1);
  }

  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div style="display:flex;gap:10px;align-items:center;">
          <button class="btn btn-outline btn-sm" onclick="shiftCalendar(-1)">←</button>
          <div style="font-family:var(--font-display);font-weight:700;font-size:1.1rem;min-width:160px;text-align:center;">${firstOfMonth.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</div>
          <button class="btn btn-outline btn-sm" onclick="shiftCalendar(1)">→</button>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="goToday()">Today</button>
      </div>
      <div class="cal-grid">
        ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
      <div style="display:flex;gap:14px;margin-top:12px;font-size:0.72rem;color:var(--text-faint);">
        <span><span class="signal amber" style="margin-right:4px;"></span>Task due</span>
        <span><span class="signal green" style="margin-right:4px;"></span>Done</span>
        <span><span class="signal red" style="margin-right:4px;"></span>Blocked</span>
        <span><span class="signal blue" style="margin-right:4px;"></span>Event</span>
        <span>📍 Checkpoint</span>
      </div>
    </div>
  `;
}
function shiftCalendar(dir){ CAL_CURSOR.setMonth(CAL_CURSOR.getMonth()+dir); renderView(); }
function goToday(){ CAL_CURSOR = new Date(); CAL_CURSOR.setDate(1); renderView(); }
function openDayModal(iso){
  const items = calendarItemsForDate(iso);
  showModal(`
    <div class="modal-head"><h3>${fmtDate(new Date(iso))}</h3><button class="btn btn-ghost" onclick="closeModal()">✕</button></div>
    ${items.length ? items.map(it=>`
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
        <span style="width:8px;height:8px;border-radius:50%;background:${it.color};flex-shrink:0;"></span>
        <div style="font-size:0.85rem;">${it.label}</div>
      </div>
    `).join('') : `<div style="color:var(--text-faint);font-size:0.85rem;padding:10px 0;">Nothing scheduled.</div>`}
    <button class="btn btn-primary btn-sm" style="width:100%;margin-top:14px;" onclick="closeModal();openEventModal('${iso}')">➕ Add event on this day</button>
  `);

    </div>

function exportICS(){
  const canSeeAll = isLeader() || isExec();
  const scheduled = computeSchedule();
  let lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Nyamuk//EN'];
  scheduled.forEach(t=>{
    if(!canSeeAll && t.assignee!==ME) return;
    if(!t._end) return;
    const d = isoDate(t._end).replace(/-/g,'');
    lines.push('BEGIN:VEVENT', `UID:${t.id}@relay`, `DTSTART;VALUE=DATE:${d}`, `SUMMARY:${(t.name||'Task').replace(/\n/g,' ')} (due)`, 'END:VEVENT');
  });
  (DB.calendarEvents||[]).forEach(ev=>{
    if(!canSeeAll && ev.attendees.length && !ev.attendees.includes(ME)) return;
    const d = ev.date.replace(/-/g,'');
    lines.push('BEGIN:VEVENT', `UID:${ev.id}@relay`, `DTSTART;VALUE=DATE:${d}`, `SUMMARY:${(ev.title||'Event').replace(/\n/g,' ')}`, 'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], { type:'text/calendar' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nyamuk-calendar.ics';
  a.click();
}

  if(!isLeader()) return;
  if(!confirm('Remove this teammate? Their assigned tasks will become unassigned.')) return;
  DB.users = DB.users.filter(u=>u.id!==userId);
  allTasks().forEach(t=>{ if(t.assignee===userId){ const ref=findTaskRef(t.id); ref.t.assignee=null; } });
  saveUsers(); saveOrg(); renderView();
}

/* ================= MODAL ================= */
function showModal(html, extraClass=''){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-veil" onclick="if(event.target===this) closeModal()">
      <div class="modal ${extraClass}">${html}</div>
    </div>
  `;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
</script>
